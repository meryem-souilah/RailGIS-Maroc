name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API + ETL dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r etl/requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check api etl

      - name: Tests
        run: pytest -q
